services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7

  minio:
    image: quay.io/minio/minio:RELEASE.2024-01-11T07-46-16Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data

  create-bucket:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: ["/bin/sh","-c"]
    command: >
      "mc alias set local http://minio:9000 minioadmin minioadmin &&
       mc mb --ignore-existing local/app &&
       mc anonymous set download local/app"

  backend:
    build:
      context: ../
      dockerfile: infra/dockerfiles/backend.Dockerfile
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@postgres:5432/app
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: app
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
    ports:
      - "8080:8080"
    volumes:
      - ../backend:/app/backend:delegated
    depends_on:
      - postgres
      - redis
      - minio

  worker:
    build:
      context: ../
      dockerfile: infra/dockerfiles/worker.Dockerfile
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@postgres:5432/app
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: app
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
    volumes:
      - ../worker:/app/worker:delegated
      - ../backend:/app/backend:delegated
    depends_on:
      - postgres
      - redis
      - minio

volumes:
  pgdata:
  minio:
